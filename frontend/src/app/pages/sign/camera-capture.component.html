<!-- Captured shot: confirm or retake -->
<div *ngIf="shotUrl(); else live">
  <div class="text-center">
    <img [src]="shotUrl()" class="cam-shot" [ngClass]="mode" alt="Foto capturada" />
  </div>
  <div class="d-flex gap-2 mt-3">
    <button type="button" class="btn btn-outline-secondary w-50" [disabled]="busy" (click)="retake()">
      <i class="bi bi-arrow-counterclockwise me-1"></i>Repetir
    </button>
    <button type="button" class="btn btn-primary w-50" [disabled]="busy" (click)="confirmShot()">
      <span *ngIf="busy" class="spinner-border spinner-border-sm me-2"></span>
      Usar esta foto
    </button>
  </div>
</div>

<ng-template #live>
  <div *ngIf="camError(); else stream" class="cam-error text-center p-4">
    <i class="bi bi-camera-video-off fs-2 d-block mb-2"></i>
    <p class="small mb-3">
      No pudimos acceder a la camara. Revisa los permisos del navegador e intentalo de nuevo.
    </p>
    <button type="button" class="btn btn-outline-primary btn-sm" (click)="start()">Reintentar</button>
  </div>

  <ng-template #stream>
    <div #wrap class="cam-wrap" [ngClass]="mode">
      <video #video autoplay playsinline muted [class.mirror]="mode === 'face'"></video>
      <div #guide class="cam-guide" [ngClass]="mode"></div>
    </div>
    <button type="button" class="btn btn-primary w-100 mt-3" (click)="capture()">
      <i class="bi bi-camera me-2"></i>Tomar foto
    </button>
  </ng-template>
</ng-template>
