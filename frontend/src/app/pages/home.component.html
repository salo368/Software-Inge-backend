<section class="home">
  <header>
    <h1>CDTS <span class="badge">{{ stage }}</span></h1>
    <button type="button" (click)="logout()" [disabled]="loading()">
      {{ loading() ? 'Saliendo…' : 'Cerrar sesión' }}
    </button>
  </header>

  @if (user(); as u) {
    <article class="profile">
      <h2>Hola, {{ u.full_name }}</h2>
      <dl>
        <dt>Email</dt>
        <dd>{{ u.email }}</dd>
        <dt>ID</dt>
        <dd><code>{{ u.id }}</code></dd>
        <dt>Miembro desde</dt>
        <dd>{{ u.created_at | date:'medium' }}</dd>
      </dl>
    </article>
  } @else {
    <p>Cargando perfil…</p>
  }
</section>
