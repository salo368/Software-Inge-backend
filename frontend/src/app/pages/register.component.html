<section class="auth-card">
  <h1>Crear cuenta</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>
      <span>Nombre</span>
      <input type="text" formControlName="full_name" autocomplete="name" required />
    </label>

    <label>
      <span>Email</span>
      <input type="email" formControlName="email" autocomplete="email" required />
    </label>

    <label>
      <span>Contraseña</span>
      <input type="password" formControlName="password" autocomplete="new-password" required />
      <small>Mínimo 10 caracteres, con letras y números.</small>
    </label>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <button type="submit" [disabled]="form.invalid || loading()">
      {{ loading() ? 'Creando…' : 'Registrarme' }}
    </button>
  </form>

  <p class="alt">
    ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
  </p>
</section>
