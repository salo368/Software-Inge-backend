[pytest]
# `tests/` keeps cross-cutting tests (parsers, helpers).
# `services/` and `platform/` hold the colocated `test.py` next to each
# Lambda's `handler.py` (see docs/repo-structure.md §8).
testpaths = tests services platform
python_files = test_*.py test.py
# importlib mode lets many files share the name `test.py` without colliding
# in sys.modules; each is loaded under its full-path-derived module name.
addopts = -ra --import-mode=importlib
