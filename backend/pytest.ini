[pytest]
# `tests/` keeps cross-cutting tests (parsers, helpers).
# `services/` and `platform/` hold the colocated `test.py` (unit) and
# optional `integration.py` (deploy-verification) next to each Lambda's
# `handler.py`. See docs/repo-structure.md §13.
testpaths = tests services platform
# `test.py` is required per Lambda (unit tests, mocked, blocking).
# `integration.py` is optional (hits real dev infra, non-blocking, gated
# behind --integration in conftest.py).
python_files = test_*.py test.py integration.py
# importlib mode lets many files share the name `test.py` / `integration.py`
# without colliding in sys.modules; each is loaded under its full-path-derived
# module name.
addopts = -ra --import-mode=importlib

markers =
    integration: hits real dev infra (API Gateway + Postgres + S3); needs pytest --integration to run. See docs/repo-structure.md §13.3.
    rnf: synthetic non-functional benchmark (latency/concurrency), no AWS calls, runs in every suite. See docs/add-signatures-uc3.md.
