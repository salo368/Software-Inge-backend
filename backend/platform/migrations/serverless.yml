service: migrations

frameworkVersion: '3'

# Servicio Serverless del bloque de INFRAESTRUCTURA runtime `platform/migrations`.
# Ver docs/repo-structure.md §5.2 y §14, y backend/platform/migrations/README.md.
#
# Publica UNA Lambda `cdts-<stage>-migrations-apply` que aplica los archivos
# .sql de sql/ en orden, saltando los que ya estan registrados en la tabla
# schema_migrations del schema del stage.

provider:
  name: aws
  runtime: python3.11
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}

  # Fuerza el naming de convencion CDTS: cdts-<stage>-<service>-<function>.
  # - stackName: nombre del CFN stack (cdts-<stage>-migrations).
  # - functions.<f>.name (definido en function.yml): fija el nombre runtime.
  stackName: cdts-${sls:stage}-migrations

  memorySize: 512
  timeout: 300
  architecture: x86_64
  logRetentionInDays: 14

  environment:
    STAGE: ${sls:stage}
    SSM_DB_PATH: /cdts/${sls:stage}/db

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - ssm:GetParameter
            - ssm:GetParameters
            - ssm:GetParametersByPath
          Resource:
            - arn:aws:ssm:${aws:region}:*:parameter/cdts/${sls:stage}/db
            - arn:aws:ssm:${aws:region}:*:parameter/cdts/${sls:stage}/db/*

package:
  individually: false
  patterns:
    - '!**/__pycache__/**'
    - '!**/*.pyc'
    - '!node_modules/**'
    - '!.pytest_cache/**'
    - '!tests/**'
    - 'src/**'
    - 'utils/**'
    - 'sql/**'

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: false
    slim: true
    layer: false
    fileName: requirements.txt

functions:
  apply: ${file(./src/handlers/apply/function.yml)}
