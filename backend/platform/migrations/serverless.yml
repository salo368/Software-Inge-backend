service: migrations

frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.11
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  stackName: cdts-${sls:stage}-migrations
  memorySize: 512
  timeout: 300
  architecture: x86_64
  logRetentionInDays: 14

  environment:
    STAGE: ${sls:stage}
    SSM_DB_PATH: /cdts/${sls:stage}/db

  iam:
    role:
      # name must match cdts-* prefix from GitHub Actions IAM policy
      name: cdts-${sls:stage}-migrations-lambda
      statements:
        - Effect: Allow
          Action:
            - ssm:GetParameter
            - ssm:GetParameters
            - ssm:GetParametersByPath
          Resource:
            - arn:aws:ssm:${aws:region}:*:parameter/cdts/${sls:stage}/db
            - arn:aws:ssm:${aws:region}:*:parameter/cdts/${sls:stage}/db/*

package:
  individually: false
  patterns:
    - '!**/__pycache__/**'
    - '!**/*.pyc'
    - '!node_modules/**'
    - '!.pytest_cache/**'
    - '!tests/**'
    # Colocated tests live next to each handler.py; keep them out of the zip.
    - '!**/test.py'
    - '!**/integration.py'
    - '!**/conftest.py'
    - 'src/**'
    - 'utils/**'
    - 'sql/**'

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: false
    # slim=false: pg8000->scramp reads its metadata at runtime
    slim: false
    layer: false
    fileName: requirements.txt

functions: ${file(./functions.js):build}
