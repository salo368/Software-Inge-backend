service: processes

frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.12
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  stackName: cdts-${sls:stage}-processes
  memorySize: 512
  timeout: 15
  logRetentionInDays: 14

  httpApi:
    cors: true

  environment:
    STAGE: ${sls:stage}
    SERVICE: processes
    SSM_DB_PATH: /cdts/${sls:stage}/db
    SSM_SMTP_PATH: /cdts/${sls:stage}/smtp

  iam:
    role:
      name: cdts-${sls:stage}-processes-lambda
      statements:
        - Effect: Allow
          Action:
            - ssm:GetParametersByPath
            - ssm:GetParameter
          Resource:
            - arn:aws:ssm:${aws:region}:*:parameter/cdts/${sls:stage}/db
            - arn:aws:ssm:${aws:region}:*:parameter/cdts/${sls:stage}/db/*
            - arn:aws:ssm:${aws:region}:*:parameter/cdts/${sls:stage}/smtp
            - arn:aws:ssm:${aws:region}:*:parameter/cdts/${sls:stage}/smtp/*
            - arn:aws:ssm:${aws:region}:*:parameter/cdts/${sls:stage}/frontend/url
        # SecureString param above is KMS-encrypted; SSM decrypts on read
        # but only if we can invoke Decrypt. Same rationale as the other
        # blocks; scoping is enforced by the ssm:GetParameter Resource.
        - Effect: Allow
          Action:
            - kms:Decrypt
          Resource: '*'
        # `create_process` corroborates (amount, term) against the live
        # rate bands by invoking banks.simulate directly instead of
        # trusting a client-supplied rate.
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource:
            - arn:aws:lambda:${aws:region}:*:function:cdts-${sls:stage}-banks-simulate
            # `set_process_form` fetches the user's form by invoking
            # forms.get_form directly instead of duplicating that lookup.
            - arn:aws:lambda:${aws:region}:*:function:cdts-${sls:stage}-forms-get-form
            # `get_required_files` fetches the process's uploaded files by
            # invoking the internal files.list_process_files Lambda.
            - arn:aws:lambda:${aws:region}:*:function:cdts-${sls:stage}-files-list-process-files
            # `get_required_files` triggers this block's own internal
            # generate_sign lambda (async) once all files are in.
            - arn:aws:lambda:${aws:region}:*:function:cdts-${sls:stage}-processes-generate-sign
            # `generate_sign` gets the populated investment order by
            # invoking files.generate_raw_investment_order (sync).
            - arn:aws:lambda:${aws:region}:*:function:cdts-${sls:stage}-files-generate-raw-investment-order
            # `get_pending_pay` sums the process's payments by invoking
            # payments.list_process_payments (sync).
            - arn:aws:lambda:${aws:region}:*:function:cdts-${sls:stage}-payments-list-process-payments
            # `generate_sign` opens the signature ceremony for that
            # document by invoking signatures.create_signature.
            - arn:aws:lambda:${aws:region}:*:function:cdts-${sls:stage}-signatures-create-signature

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: false
    slim: false
    fileName: requirements.txt

package:
  patterns:
    - '!**'
    - 'src/**'
    - 'libs/**'
    - '!**/__pycache__/**'
    - '!**/*.pyc'
    # Colocated tests live next to each handler.py; keep them out of the zip.
    - '!**/test.py'
    - '!**/integration.py'
    - '!**/conftest.py'

functions: ${file(./functions.js):build}
