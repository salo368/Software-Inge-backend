description: Consumes the 1-minute SIGNING safety-net queue; marks a signature FAILED if sign_doc hasn't completed it by then.
timeout: 30
events:
  - sqs:
      # function.yml is parsed by js-yaml (see utils/build-functions.js),
      # which doesn't understand the short !GetAtt tag -- the long form
      # below is equivalent plain YAML, no custom tag needed.
      arn:
        Fn::GetAtt: [SigningTimeoutQueue, Arn]
      batchSize: 5
