description: >
  Opens a signature ceremony. Internal M2M endpoint (X-Service-Key).
  Downloads a source PDF from a presigned URL, parks it under
  transactions/{sign_id}/original.pdf, persists the ceremony row and
  returns the sign_id + sign_url the caller must give the signer.
timeout: 20
events:
  - httpApi:
      method: POST
      path: /signatures
