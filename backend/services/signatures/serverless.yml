service: signatures

frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.12
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  stackName: cdts-${sls:stage}-signatures
  memorySize: 1024
  timeout: 15
  logRetentionInDays: 14

  httpApi:
    cors: true

  environment:
    STAGE: ${sls:stage}
    # DB + SMTP + frontend URL are shared infra; each has its own SSM path.
    SSM_DB_PATH: /cdts/${sls:stage}/db
    SSM_SMTP_PATH: /cdts/${sls:stage}/smtp
    # `create` handler builds sign_url = <frontend_base>/sign/{sign_id} using
    # this path; the frontend base URL lives at /cdts/{stage}/frontend/url.
    SSM_FRONTEND_PATH: /cdts/${sls:stage}/frontend
    # M2M shared secret. Callers of POST /signatures must send it in the
    # X-Service-Key header; `create` reads the expected value from here.
    SSM_SIGNATURES_SERVICE_KEY: /cdts/${sls:stage}/signatures/service-key
    # Signatures owns its own bucket, decoupled from `files`. Original PDFs,
    # evidences, signed PDFs, and evidence packages all live here under
    # transactions/{sign_id}/.
    SIGNATURES_BUCKET: cdts-${sls:stage}-signatures
    # verify_otp uses this to gate the async invoke of the internal 'sign'
    # Lambda. Kept 'false' until fase 4e deploys that Lambda; then flip to
    # 'true' in the same PR so verify_otp actually kicks off the signing
    # job. Leaving it off is safe: verify_otp still returns 200 and moves
    # the ceremony to 'signing', it just doesn't invoke anything and logs
    # a WARNING for the operator.
    SIGN_LAMBDA_READY: "false"

  iam:
    role:
      name: cdts-${sls:stage}-signatures-lambda
      statements:
        # SSM: DB, SMTP, frontend, service-key, and the Mock CA root.
        # `mock_ca._load_root_ca()` reads two SecureString params under
        # /cdts/{stage}/mock-ca/root/ (cert-pem + private-key-pem).
        - Effect: Allow
          Action:
            - ssm:GetParametersByPath
            - ssm:GetParameter
          Resource:
            - arn:aws:ssm:${aws:region}:*:parameter/cdts/${sls:stage}/db
            - arn:aws:ssm:${aws:region}:*:parameter/cdts/${sls:stage}/db/*
            - arn:aws:ssm:${aws:region}:*:parameter/cdts/${sls:stage}/smtp
            - arn:aws:ssm:${aws:region}:*:parameter/cdts/${sls:stage}/smtp/*
            - arn:aws:ssm:${aws:region}:*:parameter/cdts/${sls:stage}/frontend
            - arn:aws:ssm:${aws:region}:*:parameter/cdts/${sls:stage}/frontend/*
            - arn:aws:ssm:${aws:region}:*:parameter/cdts/${sls:stage}/signatures/service-key
            - arn:aws:ssm:${aws:region}:*:parameter/cdts/${sls:stage}/mock-ca/root/cert-pem
            - arn:aws:ssm:${aws:region}:*:parameter/cdts/${sls:stage}/mock-ca/root/private-key-pem
        # SecureString params are KMS-encrypted; SSM decrypts on read but
        # only if the caller can invoke KMS Decrypt on the CMK. Using '*'
        # here because the AWS-managed CMK for SSM rotates and the account
        # only exposes it as alias/aws/ssm; scoping is enforced by
        # ssm:GetParameter's own Resource guard above.
        - Effect: Allow
          Action:
            - kms:Decrypt
          Resource: '*'
        # Signatures' own bucket. Read for downloading the source PDF, the
        # evidences and the drawn signature; write for uploading the signed
        # PDF, the evidence-package.json and the audit-log.jsonl.
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource:
            - arn:aws:s3:::cdts-${sls:stage}-signatures/*
        # Rekognition for identity evidence validation (ID front/back
        # and face). Uses the S3-object variant so Rekognition reads the
        # object directly instead of us shuttling bytes.
        - Effect: Allow
          Action:
            - rekognition:DetectText
            - rekognition:DetectFaces
          Resource: '*'
        # Cross-Lambda invoke. `verify_otp` calls `sign` asynchronously via
        # libs/utils/lambda_invoke.py; scoped to signatures' own function
        # names so we can't call arbitrary lambdas by accident.
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource:
            - arn:aws:lambda:${aws:region}:*:function:cdts-${sls:stage}-signatures-*

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: false
    slim: false
    fileName: requirements.txt

package:
  patterns:
    - '!**'
    - 'src/**'
    - 'libs/**'
    - 'utils/**'
    - '!**/__pycache__/**'
    - '!**/*.pyc'
    # Colocated tests live next to each handler.py; keep them out of the zip.
    - '!**/test.py'
    - '!**/integration.py'
    - '!**/conftest.py'

functions: ${file(./functions.js):build}

resources:
  Resources:
    SignaturesBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: cdts-${sls:stage}-signatures
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        OwnershipControls:
          Rules:
            - ObjectOwnership: BucketOwnerEnforced
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        # CORS is needed for presigned PUT uploads directly from the
        # signer's browser (upload_url returns a URL the microfront
        # PUTs to). GET/HEAD needed for the microfront to render the
        # PDF via the presigned URL from `get`.
        CorsConfiguration:
          CorsRules:
            - AllowedMethods: [PUT, GET, HEAD]
              AllowedOrigins: ['*']
              AllowedHeaders: ['*']
              ExposedHeaders: [ETag]
              MaxAge: 3600
        # Academic project: no ceremony survives forever. 30 days for
        # everything (original PDFs, evidences, signed PDFs, evidence
        # packages, audit logs). If you need longer retention for a
        # specific transaction, download the signed PDF + package via
        # /verify before this fires.
        LifecycleConfiguration:
          Rules:
            - Id: expire-all-transactions-30d
              Status: Enabled
              Prefix: transactions/
              ExpirationInDays: 30

  Outputs:
    SignaturesBucketName:
      Value: !Ref SignaturesBucket
