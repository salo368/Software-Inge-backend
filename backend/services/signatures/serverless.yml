service: signatures

frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.12
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  stackName: cdts-${sls:stage}-signatures
  memorySize: 1024
  timeout: 15
  logRetentionInDays: 14

  httpApi:
    cors: true

  environment:
    STAGE: ${sls:stage}
    # DB + SMTP + frontend URL are shared infra; each has its own SSM path.
    SSM_DB_PATH: /cdts/${sls:stage}/db
    SSM_SMTP_PATH: /cdts/${sls:stage}/smtp
    # `create` handler builds sign_url = <frontend_base>/sign/{sign_id} using
    # this path; the frontend base URL lives at /cdts/{stage}/frontend/url.
    SSM_FRONTEND_PATH: /cdts/${sls:stage}/frontend
    # M2M shared secret. Callers of POST /signatures must send it in the
    # X-Service-Key header; `create` reads the expected value from here.
    SSM_SIGNATURES_SERVICE_KEY: /cdts/${sls:stage}/signatures/service-key
    # OPTIONAL, dev-only. When this SSM param exists and contains a hex key,
    # `request_otp` will disclose the plaintext OTP in the response body
    # (under `_debug_otp`) to callers that HMAC-sign sign_id with the same
    # key. Enables fully-automated integration tests to complete the
    # ceremony without a human reading the email. In production the param
    # is NEVER provisioned -- `bootstrap-signatures-v2.sh` writes it only
    # when the operator opts in for the dev stage. Env var is set on both
    # stages so a future pro operator can provision it if they choose; the
    # handler treats a missing param as "feature disabled".
    SSM_DEBUG_OTP_KEY_PATH: /cdts/${sls:stage}/signatures/debug-otp-key
    # Signatures owns its own bucket, decoupled from `files`. Original PDFs,
    # evidences, signed PDFs, and evidence packages all live here under
    # transactions/{sign_id}/.
    SIGNATURES_BUCKET: cdts-${sls:stage}-signatures
    # verify_otp uses this to gate the async invoke of the internal 'sign'
    # Lambda. Flipped to 'true' in fase 4e once `sign` is deployed. If a
    # future refactor renames or removes `sign`, flip back to 'false' so
    # verify_otp degrades to a WARNING log instead of returning 502 on
    # every invocation.
    SIGN_LAMBDA_READY: "true"

  iam:
    role:
      name: cdts-${sls:stage}-signatures-lambda
      statements:
        # SSM: DB, SMTP, frontend, service-key, and the Mock CA root.
        # `mock_ca._load_root_ca()` reads two SecureString params under
        # /cdts/{stage}/mock-ca/root/ (cert-pem + private-key-pem).
        - Effect: Allow
          Action:
            - ssm:GetParametersByPath
            - ssm:GetParameter
          Resource:
            - arn:aws:ssm:${aws:region}:*:parameter/cdts/${sls:stage}/db
            - arn:aws:ssm:${aws:region}:*:parameter/cdts/${sls:stage}/db/*
            - arn:aws:ssm:${aws:region}:*:parameter/cdts/${sls:stage}/smtp
            - arn:aws:ssm:${aws:region}:*:parameter/cdts/${sls:stage}/smtp/*
            - arn:aws:ssm:${aws:region}:*:parameter/cdts/${sls:stage}/frontend
            - arn:aws:ssm:${aws:region}:*:parameter/cdts/${sls:stage}/frontend/*
            - arn:aws:ssm:${aws:region}:*:parameter/cdts/${sls:stage}/signatures/service-key
            - arn:aws:ssm:${aws:region}:*:parameter/cdts/${sls:stage}/signatures/debug-otp-key
            - arn:aws:ssm:${aws:region}:*:parameter/cdts/${sls:stage}/mock-ca/root/cert-pem
            - arn:aws:ssm:${aws:region}:*:parameter/cdts/${sls:stage}/mock-ca/root/private-key-pem
        # SecureString params are KMS-encrypted; SSM decrypts on read but
        # only if the caller can invoke KMS Decrypt on the CMK. Using '*'
        # here because the AWS-managed CMK for SSM rotates and the account
        # only exposes it as alias/aws/ssm; scoping is enforced by
        # ssm:GetParameter's own Resource guard above.
        - Effect: Allow
          Action:
            - kms:Decrypt
          Resource: '*'
        # Signatures' own bucket. Read for downloading the source PDF, the
        # evidences and the drawn signature; write for uploading the signed
        # PDF, the evidence-package.json and the audit-log.jsonl.
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource:
            - arn:aws:s3:::cdts-${sls:stage}-signatures/*
        # HeadObject probing (utils/evidence.py::resolve_evidence_key
        # tries `.jpg` before `.png`). Without ListBucket, S3 returns
        # 403 for missing keys instead of 404 so we can't distinguish
        # "not uploaded yet" from a real permission error. Bucket-level
        # resource (no `/*`) is intentional -- ListBucket applies to the
        # bucket itself, not to individual objects.
        - Effect: Allow
          Action:
            - s3:ListBucket
          Resource:
            - arn:aws:s3:::cdts-${sls:stage}-signatures
        # Rekognition for identity evidence validation (ID front/back
        # and face). Uses the S3-object variant so Rekognition reads the
        # object directly instead of us shuttling bytes.
        - Effect: Allow
          Action:
            - rekognition:DetectText
            - rekognition:DetectFaces
          Resource: '*'
        # Cross-Lambda invoke. `verify_otp` calls `sign` asynchronously via
        # libs/utils/lambda_invoke.py; scoped to signatures' own function
        # names so we can't call arbitrary lambdas by accident.
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource:
            - arn:aws:lambda:${aws:region}:*:function:cdts-${sls:stage}-signatures-*

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: false
    slim: false
    fileName: requirements.txt

package:
  patterns:
    - '!**'
    - 'src/**'
    - 'libs/**'
    - 'utils/**'
    - '!**/__pycache__/**'
    - '!**/*.pyc'
    # Colocated tests live next to each handler.py; keep them out of the zip.
    - '!**/test.py'
    - '!**/integration.py'
    - '!**/conftest.py'

functions: ${file(./functions.js):build}

resources:
  Resources:
    SignaturesBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: cdts-${sls:stage}-signatures
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        OwnershipControls:
          Rules:
            - ObjectOwnership: BucketOwnerEnforced
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        # CORS is needed for presigned PUT uploads directly from the
        # signer's browser (upload_url returns a URL the microfront
        # PUTs to). GET/HEAD needed for the microfront to render the
        # PDF via the presigned URL from `get`.
        CorsConfiguration:
          CorsRules:
            - AllowedMethods: [PUT, GET, HEAD]
              AllowedOrigins: ['*']
              AllowedHeaders: ['*']
              ExposedHeaders: [ETag]
              MaxAge: 3600
        # Two retention tiers, split by prefix (see docs/add-signatures-uc3.md):
        #
        # - transactions/  (original PDF + biometric evidence: ID front/
        #   back, face selfie, drawn signature). Privacy-sensitive, no
        #   regulatory reason to keep past the ceremony's operational
        #   window -> hard-delete at 30 days, unchanged from before.
        #
        # - evidence-archive/  (signed.pdf + evidence-package.json only,
        #   written exclusively by the `sign` worker). This IS the
        #   probative document + its audit trail -> regulatory retention
        #   of 10 years. Transition to GLACIER_IR (Instant Retrieval) at
        #   30 days rather than GLACIER/DEEP_ARCHIVE: same archival cost,
        #   but reads still resolve in milliseconds, so `verify` and
        #   `get` keep serving signed_pdf_url without a multi-hour
        #   restore workflow.
        LifecycleConfiguration:
          Rules:
            - Id: expire-transactions-30d
              Status: Enabled
              Prefix: transactions/
              ExpirationInDays: 30
            - Id: archive-evidence-10y
              Status: Enabled
              Prefix: evidence-archive/
              Transitions:
                - TransitionInDays: 30
                  StorageClass: GLACIER_IR
              ExpirationInDays: 3650

  Outputs:
    SignaturesBucketName:
      Value: !Ref SignaturesBucket
