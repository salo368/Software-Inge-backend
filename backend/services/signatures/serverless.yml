service: signatures

frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.12
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  stackName: cdts-${sls:stage}-signatures
  memorySize: 1024
  timeout: 15
  logRetentionInDays: 14

  httpApi:
    cors:
      allowedHeaders:
        - Content-Type
        - X-Amz-Date
        - Authorization
        - X-Api-Key
        - X-Amz-Security-Token
        - X-Amz-User-Agent
        - X-Debug-OTP-Signature

  environment:
    STAGE: ${sls:stage}
    # Lets resolve_otp / sign_doc invoke their sibling Lambdas via
    # libs.utils.lambda_invoke without naming "signatures" at the call site.
    SERVICE: signatures
    # DB + SMTP are shared infra; each has its own SSM path.
    SSM_DB_PATH: /cdts/${sls:stage}/db
    SSM_SMTP_PATH: /cdts/${sls:stage}/smtp
    # Signatures owns its own bucket, decoupled from `files`. Original PDFs,
    # evidences, signed PDFs, and evidence packages all live here under
    # transactions/{sign_id}/.
    SIGNATURES_BUCKET: cdts-${sls:stage}-signatures
    # create_signature enqueues one delayed message per signature here
    # (DelaySeconds = SIGNING_WINDOW); check_signature_timeout consumes
    # it and marks the row FAILED if it never reached SIGNED.
    SIGNATURE_TIMEOUT_QUEUE_URL: !Ref SignatureTimeoutQueue
    # resolve_otp enqueues here (DelaySeconds = SIGNING_TIMEOUT) right when
    # it hands a signature off to sign_doc; check_signing_timeout consumes
    # it and marks the row FAILED if sign_doc never got it to SIGNED.
    SIGNING_TIMEOUT_QUEUE_URL: !Ref SigningTimeoutQueue

  iam:
    role:
      name: cdts-${sls:stage}-signatures-lambda
      statements:
        # SSM: DB, SMTP and the Mock CA root.
        # `signature_ca` reads two SecureString params under
        # /cdts/{stage}/mock-ca/root/ (cert-pem + private-key-pem).
        - Effect: Allow
          Action:
            - ssm:GetParametersByPath
            - ssm:GetParameter
          Resource:
            - arn:aws:ssm:${aws:region}:*:parameter/cdts/${sls:stage}/db
            - arn:aws:ssm:${aws:region}:*:parameter/cdts/${sls:stage}/db/*
            - arn:aws:ssm:${aws:region}:*:parameter/cdts/${sls:stage}/smtp
            - arn:aws:ssm:${aws:region}:*:parameter/cdts/${sls:stage}/smtp/*
            - arn:aws:ssm:${aws:region}:*:parameter/cdts/${sls:stage}/mock-ca/root/cert-pem
            - arn:aws:ssm:${aws:region}:*:parameter/cdts/${sls:stage}/mock-ca/root/private-key-pem
        # SecureString params are KMS-encrypted; SSM decrypts on read but
        # only if the caller can invoke KMS Decrypt on the CMK. Using '*'
        # here because the AWS-managed CMK for SSM rotates and the account
        # only exposes it as alias/aws/ssm; scoping is enforced by
        # ssm:GetParameter's own Resource guard above.
        - Effect: Allow
          Action:
            - kms:Decrypt
          Resource: '*'
        # Signatures' own bucket. Read for downloading the source PDF, the
        # evidences and the drawn signature; write for uploading the signed
        # PDF, the evidence-package.json and the audit-log.jsonl.
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource:
            - arn:aws:s3:::cdts-${sls:stage}-signatures/*
        # HeadObject probing (utils/evidence.py::resolve_evidence_key
        # tries `.jpg` before `.png`). Without ListBucket, S3 returns
        # 403 for missing keys instead of 404 so we can't distinguish
        # "not uploaded yet" from a real permission error. Bucket-level
        # resource (no `/*`) is intentional -- ListBucket applies to the
        # bucket itself, not to individual objects.
        - Effect: Allow
          Action:
            - s3:ListBucket
          Resource:
            - arn:aws:s3:::cdts-${sls:stage}-signatures
        # Rekognition for identity evidence validation (ID front/back
        # and face). Uses the S3-object variant so Rekognition reads the
        # object directly instead of us shuttling bytes.
        - Effect: Allow
          Action:
            - rekognition:DetectText
            - rekognition:DetectFaces
          Resource: '*'
        # Cross-Lambda invoke. `resolve_otp` calls `sign_doc` and
        # notify_terminal_state calls `notify_signed`, asynchronously via
        # libs/utils/lambda_invoke.py; scoped to signatures' own function
        # names so we can't call arbitrary lambdas by accident.
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource:
            - arn:aws:lambda:${aws:region}:*:function:cdts-${sls:stage}-signatures-*
            # notify_terminal_state tells processes a signature finished by
            # invoking its `signed` webhook lambda (async).
            - arn:aws:lambda:${aws:region}:*:function:cdts-${sls:stage}-processes-signed
        # create_signature / resolve_otp send the timeout messages;
        # check_signature_timeout / check_signing_timeout consume them
        # (serverless also auto-adds consumer permissions for the sqs:
        # event trigger, but listing them explicitly keeps this role
        # self-documenting).
        - Effect: Allow
          Action:
            - sqs:SendMessage
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
          Resource:
            - !GetAtt SignatureTimeoutQueue.Arn
            - !GetAtt SigningTimeoutQueue.Arn

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: false
    slim: false
    fileName: requirements.txt

package:
  patterns:
    - '!**'
    - 'src/**'
    - 'libs/**'
    - 'utils/**'
    - '!**/__pycache__/**'
    - '!**/*.pyc'
    # Colocated tests live next to each handler.py; keep them out of the zip.
    - '!**/test.py'
    - '!**/integration.py'
    - '!**/conftest.py'

functions: ${file(./functions.js):build}

resources:
  Resources:
    SignaturesBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: cdts-${sls:stage}-signatures
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        OwnershipControls:
          Rules:
            - ObjectOwnership: BucketOwnerEnforced
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        # CORS is needed for presigned PUT uploads directly from the
        # signer's browser (upload_url returns a URL the microfront
        # PUTs to). GET/HEAD needed for the microfront to render the
        # PDF via the presigned URL from `get`.
        CorsConfiguration:
          CorsRules:
            - AllowedMethods: [PUT, GET, HEAD]
              AllowedOrigins: ['*']
              AllowedHeaders: ['*']
              ExposedHeaders: [ETag]
              MaxAge: 3600
        # Academic project: no ceremony survives forever. 30 days for
        # everything (original PDFs, evidences, signed PDFs, evidence
        # packages, audit logs). If you need longer retention for a
        # specific transaction, download the signed PDF + package via
        # /verify before this fires.
        LifecycleConfiguration:
          Rules:
            - Id: expire-all-transactions-30d
              Status: Enabled
              Prefix: transactions/
              ExpirationInDays: 30

    SignatureTimeoutQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: cdts-${sls:stage}-signatures-timeout
        # 900s = 15 min = SIGNING_WINDOW, the max DelaySeconds SQS allows.
        VisibilityTimeout: 60
        MessageRetentionPeriod: 345600 # 4 days (SQS default)

    SigningTimeoutQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: cdts-${sls:stage}-signatures-signing-timeout
        # 60s = SIGNING_TIMEOUT. VisibilityTimeout only needs to cover
        # check_signing_timeout's own (cheap, DB-only) processing time.
        VisibilityTimeout: 30
        MessageRetentionPeriod: 345600 # 4 days (SQS default)

  Outputs:
    SignaturesBucketName:
      Value: !Ref SignaturesBucket
