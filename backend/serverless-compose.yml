services:
  migrations:
    path: platform/migrations

  assets:
    path: platform/assets

  auth:
    path: services/auth
    dependsOn:
      - migrations
  admin_auth:
    path: services/admin_auth
    dependsOn:
      - migrations

  banks:
    path: services/banks
    dependsOn:
      - migrations

  files:
    path: services/files
    dependsOn:
      - migrations

  forms:
    path: services/forms
    dependsOn:
      - migrations

  processes:
    path: services/processes
    dependsOn:
      - migrations

  payments:
    path: services/payments
    dependsOn:
      - migrations
      - files
  signatures:
    path: services/signatures
    dependsOn:
      - migrations
      - files
