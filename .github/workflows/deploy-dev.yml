name: Deploy DEV

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      block:
        description: "Block to force (empty = auto-detect; '__all__' = all blocks)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  # --------------------------------------------------------------------------
  # 1) plan: single source of truth for which blocks the pipeline touches.
  #    Emits three outputs the rest of the workflow consumes:
  #      * blocks         - JSON array of all planned blocks, ordered
  #                         (migrations first, then alphabetical)
  #      * blocks_others  - same, minus 'migrations' -- feeds the parallel
  #                         package matrix
  #      * has_migrations - "true" if the migrations block is in the plan;
  #                         gates the migrations package
  # --------------------------------------------------------------------------
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      blocks: ${{ steps.plan.outputs.blocks }}
      blocks_others: ${{ steps.plan.outputs.blocks_others }}
      count: ${{ steps.plan.outputs.count }}
      others_count: ${{ steps.plan.outputs.others_count }}
      has_migrations: ${{ steps.plan.outputs.has_migrations }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute deploy plan
        id: plan
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          MANUAL_BLOCK: ${{ inputs.block }}
        run: bash scripts/ci/plan-deploy.sh

  # --------------------------------------------------------------------------
  # 2) validate: cross-cutting checks that are cheaper to run once than per
  #    block (SQL lint, JS helper tests, serverless-compose package,
  #    cross-cutting pytest of backend/tests/).
  # --------------------------------------------------------------------------
  validate:
    name: Validate
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Node dependencies
        working-directory: backend
        run: npm ci

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint SQL migrations
        run: python scripts/ci/lint-migrations.py

      - name: Test JS helpers (node --test)
        working-directory: backend
        run: |
          if ls tests/*.test.js >/dev/null 2>&1; then
            node --test tests/*.test.js
          else
            echo "::notice::No JS tests found; skip."
          fi

      - name: Validate serverless-compose (package)
        working-directory: backend
        run: |
          if grep -qE "^  [A-Za-z0-9_-]+:" serverless-compose.yml; then
            npx serverless-compose package --stage dev
          else
            echo "::notice::No services registered; skip package."
          fi

      # Cross-cutting pytest suite (backend/tests/*): parsers, JS-helper unit
      # tests, and other things that are not tied to a single Lambda. The
      # per-Lambda `test.py` and `integration.py` files run inside each
      # block's package (below).
      - name: Run cross-cutting pytest (backend/tests)
        working-directory: backend
        run: |
          if [ -d tests ] && ls tests/test_*.py >/dev/null 2>&1; then
            python -m pytest tests -ra --junitxml=pytest-report.xml
          else
            echo "::notice::No cross-cutting tests found; skip pytest."
          fi

      - name: Upload pytest report (if any)
        if: always() && hashFiles('backend/pytest-report.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-dev
          path: backend/pytest-report.xml
          retention-days: 7

  # --------------------------------------------------------------------------
  # 3) migrations package (gate). Runs ONLY if migrations is in the plan.
  #    Everything else waits for this so the schema is guaranteed to be
  #    current before any block deploys against it.
  # --------------------------------------------------------------------------
  migrations:
    name: migrations
    needs: [plan, validate]
    if: needs.plan.outputs.has_migrations == 'true'
    uses: ./.github/workflows/block-package.yml
    secrets: inherit
    with:
      block: migrations
      stage: dev

  # --------------------------------------------------------------------------
  # 4) packages: one reusable-workflow invocation per remaining block,
  #    fanned out via matrix. Each invocation runs test -> deploy ->
  #    integration internally (see block-package.yml). Packages run in
  #    parallel across blocks; each block's stages run sequentially inside.
  #    The `always()` gate lets this run even when there is no migrations
  #    in the plan (then `needs.migrations.result == 'skipped'`).
  # --------------------------------------------------------------------------
  packages:
    name: ${{ matrix.block }}
    needs: [plan, validate, migrations]
    if: >
      always() &&
      needs.plan.outputs.others_count != '0' &&
      needs.validate.result == 'success' &&
      (needs.migrations.result == 'success' || needs.migrations.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        block: ${{ fromJson(needs.plan.outputs.blocks_others) }}
    uses: ./.github/workflows/block-package.yml
    secrets: inherit
    with:
      block: ${{ matrix.block }}
      stage: dev

  # --------------------------------------------------------------------------
  # 5) summary: always runs. Aggregates per-block integration outcomes from
  #    the artifacts each package uploads (job-level `.result` for reusable
  #    workflows collapses everything into one status, so we read the
  #    integration-status-<block>.txt files for granularity).
  # --------------------------------------------------------------------------
  summary:
    name: Deploy summary
    needs: [plan, validate, migrations, packages]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download integration statuses
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: integration-status-*
          path: /tmp/int-status
          merge-multiple: true
        continue-on-error: true

      - name: Print summary
        run: |
          int_section=""
          if compgen -G "/tmp/int-status/*.txt" > /dev/null; then
            while IFS= read -r f; do
              block=$(basename "$f" .txt)
              outcome=$(tr -d '[:space:]' < "$f")
              case "$outcome" in
                success) icon=":white_check_mark:" ;;
                skipped) icon=":fast_forward:" ;;
                *)       icon=":x:" ;;
              esac
              int_section+="  - ${icon} \`${block}\`: ${outcome}"$'\n'
            done < <(ls /tmp/int-status/*.txt)
          else
            int_section="  - _(no integration jobs ran)_"$'\n'
          fi

          {
            echo "### Deploy DEV summary"
            echo ""
            echo "Plan:            **${{ needs.plan.result }}** (blocks: ${{ needs.plan.outputs.count }})"
            echo '```json'
            echo '${{ needs.plan.outputs.blocks }}'
            echo '```'
            echo "Validate:        **${{ needs.validate.result }}**"
            echo "Migrations gate: **${{ needs.migrations.result }}**"
            echo "Packages:        **${{ needs.packages.result }}**"
            echo ""
            echo "**Integration (non-blocking, dev only, per block):**"
            echo ""
            echo "${int_section}"
            echo ""
            echo "> Each block's package runs test -> deploy -> integration in sequence."
            echo "> Packages run in parallel across blocks. Integration failures do NOT"
            echo "> roll back the deploy; investigate the pytest-integration-dev-<block>"
            echo "> artifact and the annotations panel on this run before promoting to pro."
          } >> "$GITHUB_STEP_SUMMARY"
