name: Deploy DEV

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      block:
        description: "Block to force (empty = auto-detect; '__all__' = all blocks)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      blocks: ${{ steps.plan.outputs.blocks }}
      count: ${{ steps.plan.outputs.count }}
      backend_count: ${{ steps.plan.outputs.backend_count }}
      frontend_infra_changed: ${{ steps.plan.outputs.frontend_infra_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute deploy plan
        id: plan
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          MANUAL_BLOCK: ${{ inputs.block }}
        run: bash scripts/ci/plan-deploy.sh

  validate:
    name: Validate
    needs: plan
    # Skip when the plan is purely frontend (Validate checks backend only).
    if: needs.plan.outputs.backend_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Node dependencies
        working-directory: backend
        run: npm ci

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint SQL migrations
        run: python scripts/ci/lint-migrations.py

      - name: Test JS helpers (node --test)
        working-directory: backend
        run: |
          if ls tests/*.test.js >/dev/null 2>&1; then
            node --test tests/*.test.js
          else
            echo "::notice::No JS tests found; skip."
          fi

      - name: Validate serverless-compose (package)
        working-directory: backend
        run: |
          if grep -qE "^  [A-Za-z0-9_-]+:" serverless-compose.yml; then
            npx serverless-compose package --stage dev
          else
            echo "::notice::No services registered; skip package."
          fi

      - name: Run pytest
        working-directory: backend
        run: |
          if [ -d tests ] && ls tests/test_*.py >/dev/null 2>&1; then
            python -m pytest tests -ra --junitxml=pytest-report.xml
          else
            echo "::notice::No tests found; skip pytest."
          fi

      - name: Upload pytest report (if any)
        if: always() && hashFiles('backend/pytest-report.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-dev
          path: backend/pytest-report.xml
          retention-days: 7

  deploy:
    name: Deploy ${{ matrix.block }} (dev)
    needs: [plan, validate]
    # Runs if there is anything to deploy AND validate succeeded (or was skipped
    # because the plan is purely frontend).
    if: |
      !cancelled()
      && needs.plan.outputs.count != '0'
      && (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        block: ${{ fromJson(needs.plan.outputs.blocks) }}
    environment:
      name: dev
      url: https://console.aws.amazon.com/cloudformation/home?region=${{ vars.AWS_REGION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (backend)
        if: matrix.block != 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Setup Node.js (frontend)
        if: matrix.block == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        if: matrix.block != 'frontend'
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # ---------------- Backend path ----------------

      - name: Install Node dependencies (backend)
        if: matrix.block != 'frontend'
        working-directory: backend
        run: npm ci

      - name: Deploy backend block "${{ matrix.block }}"
        if: matrix.block != 'frontend'
        working-directory: backend
        run: |
          if [ ! -f serverless-compose.yml ] || ! grep -qE '^  [A-Za-z0-9_-]+:' serverless-compose.yml; then
            echo "::notice::No services registered; nothing to deploy."
            exit 0
          fi
          npx serverless-compose "${{ matrix.block }}:deploy" --stage dev --verbose

      - name: Apply migrations (if block == migrations)
        if: matrix.block == 'migrations'
        run: |
          aws lambda invoke \
            --function-name cdts-dev-migrations-apply \
            --payload '{}' \
            --cli-binary-format raw-in-base64-out \
            --log-type Tail \
            --query 'LogResult' --output text \
            /tmp/response.json | base64 -d
          echo ""
          echo "== Response =="
          cat /tmp/response.json
          echo ""
          if grep -q '"errorType"' /tmp/response.json; then
            echo "::error::Lambda returned an error. See logs above."
            exit 1
          fi

      # ---------------- Frontend path ----------------

      - name: Install Node dependencies (frontend)
        if: matrix.block == 'frontend'
        working-directory: frontend
        # npm install (not ci): Angular's lock file has multiple versions of
        # chokidar/readdirp in the tree; npm ci rejects it as inconsistent.
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Deploy frontend infra (S3 + CloudFront)
        # Skip sls deploy when only frontend/src/** changed; the stack does
        # not need to change, only assets need re-sync.
        if: matrix.block == 'frontend' && needs.plan.outputs.frontend_infra_changed == '1'
        working-directory: frontend
        run: npx serverless deploy --stage dev --verbose

      - name: Build Angular (dev)
        if: matrix.block == 'frontend'
        working-directory: frontend
        run: npx ng build --configuration dev

      - name: Sync assets to S3 and invalidate CloudFront
        if: matrix.block == 'frontend'
        run: |
          BUCKET="$(aws cloudformation describe-stacks --stack-name cdts-dev-frontend \
            --query 'Stacks[0].Outputs[?OutputKey==`WebBucketName`].OutputValue' --output text)"
          DIST_ID="$(aws cloudformation describe-stacks --stack-name cdts-dev-frontend \
            --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontDistributionId`].OutputValue' --output text)"
          DOMAIN="$(aws cloudformation describe-stacks --stack-name cdts-dev-frontend \
            --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontDomainName`].OutputValue' --output text)"
          echo "Bucket:   ${BUCKET}"
          echo "DistId:   ${DIST_ID}"
          echo "Domain:   https://${DOMAIN}"
          BUCKET="${BUCKET}" DIST_ID="${DIST_ID}" \
            DIST_DIR="frontend/dist/cdts-frontend/browser" \
            bash scripts/ci/deploy-frontend.sh
          echo "::notice::Frontend deployed: https://${DOMAIN}"

  summary:
    name: Deploy summary
    needs: [plan, validate, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Print summary
        run: |
          {
            echo "### Deploy DEV summary"
            echo ""
            echo "Plan:      **${{ needs.plan.result }}** (blocks: ${{ needs.plan.outputs.count }}, backend: ${{ needs.plan.outputs.backend_count }}, frontend_infra_changed: ${{ needs.plan.outputs.frontend_infra_changed }})"
            echo '```json'
            echo '${{ needs.plan.outputs.blocks }}'
            echo '```'
            echo "Validate:  **${{ needs.validate.result }}**"
            echo "Deploy:    **${{ needs.deploy.result }}**"
          } >> "$GITHUB_STEP_SUMMARY"
