name: Deploy PRO

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      block:
        description: "Block to force (empty = auto-detect; '__all__' = full backend)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-pro
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Node dependencies
        working-directory: backend
        run: npm ci

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint SQL migrations
        run: python scripts/ci/lint-migrations.py

      - name: Validate serverless-compose (package)
        working-directory: backend
        run: |
          if grep -qE "^  [A-Za-z0-9_-]+:" serverless-compose.yml; then
            npx serverless-compose package --stage pro
          else
            echo "::notice::No services registered; skip package."
          fi

      - name: Run pytest
        working-directory: backend
        run: |
          if [ -d tests ] && ls tests/test_*.py >/dev/null 2>&1; then
            python -m pytest tests -ra --junitxml=pytest-report.xml
          else
            echo "::notice::No tests found; skip pytest."
          fi

      - name: Upload pytest report (if any)
        if: always() && hashFiles('backend/pytest-report.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-pro
          path: backend/pytest-report.xml
          retention-days: 7

  plan:
    name: Plan
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      blocks: ${{ steps.plan.outputs.blocks }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute deploy plan
        id: plan
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          MANUAL_BLOCK: ${{ inputs.block }}
        run: bash scripts/ci/plan-deploy.sh

  deploy:
    name: Deploy ${{ matrix.block }} (pro)
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        block: ${{ fromJson(needs.plan.outputs.blocks) }}
    environment:
      name: pro
      url: https://console.aws.amazon.com/cloudformation/home?region=${{ vars.AWS_REGION }}
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version

      - name: Install Node dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy block "${{ matrix.block }}"
        run: |
          if [ ! -f serverless-compose.yml ] || ! grep -qE '^  [A-Za-z0-9_-]+:' serverless-compose.yml; then
            echo "::notice::No services registered; nothing to deploy."
            exit 0
          fi
          npx serverless-compose "${{ matrix.block }}:deploy" --stage pro --verbose

      - name: Apply migrations (if block == migrations)
        if: matrix.block == 'migrations'
        run: |
          aws lambda invoke \
            --function-name cdts-pro-migrations-apply \
            --payload '{}' \
            --cli-binary-format raw-in-base64-out \
            --log-type Tail \
            --query 'LogResult' --output text \
            /tmp/response.json | base64 -d
          echo ""
          echo "== Response =="
          cat /tmp/response.json
          echo ""
          if grep -q '"errorType"' /tmp/response.json; then
            echo "::error::Lambda returned an error. See logs above."
            exit 1
          fi

  summary:
    name: Deploy summary
    needs: [validate, plan, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Print summary
        run: |
          {
            echo "### Deploy PRO summary"
            echo ""
            echo "Validate:  **${{ needs.validate.result }}**"
            echo "Plan:      **${{ needs.plan.result }}** (blocks: ${{ needs.plan.outputs.count }})"
            echo '```json'
            echo '${{ needs.plan.outputs.blocks }}'
            echo '```'
            echo ""
            echo "Deploy:    **${{ needs.deploy.result }}**"
          } >> "$GITHUB_STEP_SUMMARY"
