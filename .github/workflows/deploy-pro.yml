name: Deploy PRO

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      block:
        description: "Block to force (empty = auto-detect; '__all__' = all blocks)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-pro
  cancel-in-progress: false

jobs:
  # Same shape as deploy-dev.yml but with stage=pro (the reusable
  # block-package skips its `integration` job for that stage). See
  # docs/repo-structure.md §15 for the pipeline flow.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      blocks: ${{ steps.plan.outputs.blocks }}
      blocks_others: ${{ steps.plan.outputs.blocks_others }}
      count: ${{ steps.plan.outputs.count }}
      others_count: ${{ steps.plan.outputs.others_count }}
      has_migrations: ${{ steps.plan.outputs.has_migrations }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute deploy plan
        id: plan
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          MANUAL_BLOCK: ${{ inputs.block }}
        run: bash scripts/ci/plan-deploy.sh

  validate:
    name: Validate
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Node dependencies
        working-directory: backend
        run: npm ci

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint SQL migrations
        run: python scripts/ci/lint-migrations.py

      - name: Test JS helpers (node --test)
        working-directory: backend
        run: |
          if ls tests/*.test.js >/dev/null 2>&1; then
            node --test tests/*.test.js
          else
            echo "::notice::No JS tests found; skip."
          fi

      - name: Validate serverless-compose (package)
        working-directory: backend
        run: |
          if grep -qE "^  [A-Za-z0-9_-]+:" serverless-compose.yml; then
            npx serverless-compose package --stage pro
          else
            echo "::notice::No services registered; skip package."
          fi

      - name: Run cross-cutting pytest (backend/tests)
        working-directory: backend
        run: |
          if [ -d tests ] && ls tests/test_*.py >/dev/null 2>&1; then
            python -m pytest tests -ra --junitxml=pytest-report.xml
          else
            echo "::notice::No cross-cutting tests found; skip pytest."
          fi

      - name: Upload pytest report (if any)
        if: always() && hashFiles('backend/pytest-report.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-pro
          path: backend/pytest-report.xml
          retention-days: 7

  migrations:
    name: migrations
    needs: [plan, validate]
    if: needs.plan.outputs.has_migrations == 'true'
    uses: ./.github/workflows/block-package.yml
    secrets: inherit
    with:
      block: migrations
      stage: pro

  packages:
    name: ${{ matrix.block }}
    needs: [plan, validate, migrations]
    if: >
      always() &&
      needs.plan.outputs.others_count != '0' &&
      needs.validate.result == 'success' &&
      (needs.migrations.result == 'success' || needs.migrations.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        block: ${{ fromJson(needs.plan.outputs.blocks_others) }}
    uses: ./.github/workflows/block-package.yml
    secrets: inherit
    with:
      block: ${{ matrix.block }}
      stage: pro

  summary:
    name: Deploy summary
    needs: [plan, validate, migrations, packages]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Print summary
        run: |
          {
            echo "### Deploy PRO summary"
            echo ""
            echo "Plan:            **${{ needs.plan.result }}** (blocks: ${{ needs.plan.outputs.count }})"
            echo '```json'
            echo '${{ needs.plan.outputs.blocks }}'
            echo '```'
            echo "Validate:        **${{ needs.validate.result }}**"
            echo "Migrations gate: **${{ needs.migrations.result }}**"
            echo "Packages:        **${{ needs.packages.result }}**"
            echo ""
            echo "> Each block's package runs test -> deploy in sequence."
            echo "> Packages run in parallel across blocks."
            echo "> Integration tests are intentionally NOT run in production."
          } >> "$GITHUB_STEP_SUMMARY"
