name: CI

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Validate serverless-compose (print)
        run: |
          if grep -qE "^  [A-Za-z0-9_-]+:" serverless-compose.yml; then
            npx serverless-compose print --stage dev
          else
            echo "::notice::serverless-compose.yml no tiene services todavia, skip print."
          fi

      - name: Run pytest
        run: |
          if [ -d tests ] && ls tests/test_*.py >/dev/null 2>&1; then
            python -m pytest tests -ra --junitxml=pytest-report.xml
          else
            echo "::notice::No hay tests todavia (tests/test_*.py), skip pytest."
          fi

      - name: Upload pytest report (if any)
        if: always() && hashFiles('backend/pytest-report.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: backend/pytest-report.xml
          retention-days: 7

  plan-preview:
    name: Deploy plan (preview)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute deploy plan (dry-run)
        id: plan
        env:
          DRY_RUN: "1"
        run: bash scripts/ci/plan-deploy.sh

      - name: Post preview to PR summary
        run: |
          {
            echo "### Deploy plan (preview) para ${{ github.base_ref }}"
            echo ""
            echo "Si esta PR se mergea, se re-desplegaran los siguientes bloques"
            echo "en el ambiente que corresponda al target branch."
            echo ""
            echo "> Este job es SOLO informativo. El plan real se recalcula en el"
            echo "> workflow de deploy tras el merge, usando el diff efectivo."
            echo ""
            echo "Ver stdout del step anterior para el detalle del plan."
          } >> "$GITHUB_STEP_SUMMARY"
