name: CI

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Validate serverless-compose (print)
        run: |
          if grep -qE "^  [A-Za-z0-9_-]+:" serverless-compose.yml; then
            npx serverless-compose print --stage dev
          else
            echo "::notice::serverless-compose.yml no tiene services todavia, skip print."
          fi

      - name: Run pytest
        run: |
          if [ -d tests ] && ls tests/test_*.py >/dev/null 2>&1; then
            python -m pytest tests -ra --junitxml=pytest-report.xml
          else
            echo "::notice::No hay tests todavia (tests/test_*.py), skip pytest."
          fi

      - name: Upload pytest report (if any)
        if: always() && hashFiles('pytest-report.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml
          retention-days: 7
